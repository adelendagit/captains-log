name: Build Kindle KPM package

on:
  push:
    branches: [main]
    paths:
      - 'kindle/kpm/skibidi-display/**'
      - '.github/workflows/build-kindle-kpm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch KPM helper
        run: curl -fsSL https://raw.githubusercontent.com/KindleModding/KPM/main/kpm-helper.py -o /tmp/kpm-helper.py
      - name: Build package
        run: |
          mkdir -p public/kpm/artifacts
          python /tmp/kpm-helper.py package pack kindle/kpm/skibidi-display public/kpm/artifacts
          ARTIFACT=$(ls -1v public/kpm/artifacts/skibidi-display_*_kindlehf.kpkg | tail -1)
          test -n "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
      - name: Commit built artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ARTIFACT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build $(basename "$ARTIFACT")"
          git pull --rebase origin main
          git push
