name: Regenerate brand icons

on:
  push:
    branches: [main]
    paths:
      - "public/icons/logo.svg"
      - "scripts/generate-icons.js"
      - "scripts/generate-ios-app-icon.js"
      - ".github/workflows/regenerate-brand-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate web icons
        run: npm run icons

      - name: Generate iOS app icon
        run: npm run icons:ios

      - name: Commit generated icons
        shell: bash
        run: |
          git add \
            public/icons/icon-192.png \
            public/icons/icon-512.png \
            public/icons/favicon-16.png \
            public/icons/favicon-32.png \
            public/icons/favicon-48.png \
            public/apple-touch-icon.png \
            public/favicon.ico \
            ios/CaptainsLog/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          if git diff --cached --quiet; then
            echo "Generated icons are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Skibidi web and iOS icons"
          git push
