<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skibidi — Kindle Map</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: white; color: black; font: 18px Arial, Helvetica, sans-serif; }
    header { border-bottom: 4px solid black; padding-bottom: 14px; }
    h1 { margin: 0 0 14px; font-size: 36px; letter-spacing: 3px; }
    a { color: black; }
    nav a, button { display: inline-block; background: white; color: black; border: 2px solid black; padding: 10px 14px; font: bold 18px Arial, sans-serif; text-decoration: none; margin: 0 6px 6px 0; }
    button[disabled] { background: black; color: white; }\n    #exit-display { float: right; }
    h2 { font-size: 28px; margin: 18px 0 8px; }
    p { margin: 8px 0; line-height: 1.35; }
    #map { display: none; width: 100%; height: auto; border: 2px solid black; margin-top: 12px; }
    #error { display: none; border: 2px solid black; padding: 10px; }
    footer { margin-top: 12px; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <h1>SKIBIDI · MAP</h1>
    <nav aria-label="Display pages and map scale">
      <a href="/kindle.html">Status</a>
      <button id="local" type="button" disabled>Local</button>
      <button id="wide" type="button">Area</button>\n      <button id="exit-display" type="button">Exit</button>
    </nav>
  </header>
  <h2 id="place">Finding Skibidi…</h2>
  <p id="position">Loading position…</p>
  <p id="error" role="status">Unable to refresh. Any displayed position may be out of date. Retrying automatically.</p>
  <img id="map" width="600" height="460" alt="Coastline map centred on Skibidi. The circled dot marks the recorded position. North is up.">
  <p id="updated"></p>
  <footer>Circle = recorded position · Shaded = land<br>
    Coastlines: OpenStreetMap / geo-maps · Simplified overview
  </footer>
  <script src="/js/kindle-map.js"></script>
</body>
</html>
