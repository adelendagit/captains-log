<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skibidi — Kindle Display</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; padding: 42px 34px; }
    header { border-bottom: 5px solid #000; padding-bottom: 22px; margin-bottom: 34px; }
    h1 { margin: 0; font-size: 72px; line-height: 1; letter-spacing: 5px; }
    .subtitle { margin-top: 12px; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
    .status { display: inline-block; margin: 0 0 34px; padding: 10px 16px; border: 4px solid #000; font-size: 28px; font-weight: bold; text-transform: uppercase; }
    .label { margin-top: 24px; font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
    .place { margin: 8px 0 30px; font-size: 52px; line-height: 1.08; font-weight: bold; }
    .coords { margin: 8px 0 32px; font-family: monospace; font-size: 29px; line-height: 1.35; }
    .grid { display: table; width: 100%; border-top: 3px solid #000; border-bottom: 3px solid #000; margin-top: 22px; }
    .cell { display: table-cell; width: 50%; padding: 22px 8px 22px 0; vertical-align: top; }
    .cell + .cell { border-left: 3px solid #000; padding-left: 22px; }
    .value { margin-top: 5px; font-size: 36px; font-weight: bold; }
    footer { margin-top: 34px; font-size: 20px; line-height: 1.45; }
    #error { display: none; border: 4px solid #000; padding: 18px; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>SKIBIDI</h1>
    <div class="subtitle">Captain's Log · E-ink display</div>
  </header>

  <main id="display">
    <div id="status" class="status">Loading…</div>

    <div class="label">Current location</div>
    <div id="place" class="place">Finding Skibidi…</div>

    <div class="label">Position</div>
    <div id="coords" class="coords">—</div>

    <div class="grid">
      <div class="cell">
        <div class="label">Speed</div>
        <div id="speed" class="value">—</div>
      </div>
      <div class="cell">
        <div class="label">Course</div>
        <div id="course" class="value">—</div>
      </div>
    </div>

    <footer>
      <strong>Position:</strong> <span id="freshness">—</span><br>
      <strong>Updated:</strong> <span id="updated">—</span>
    </footer>
  </main>

  <div id="error">Unable to load Skibidi's position. Retrying automatically.</div>

  <script>
    function first(obj, paths) {
      for (var i = 0; i < paths.length; i++) {
        var value = obj;
        var parts = paths[i].split('.');
        for (var j = 0; j < parts.length && value != null; j++) value = value[parts[j]];
        if (value !== undefined && value !== null && value !== '') return value;
      }
      return null;
    }

    function number(value) {
      var n = Number(value);
      return isFinite(n) ? n : null;
    }

    function render(state) {
      var telemetry = state.telemetry || {};
      var journey = state.journey || state.currentJourney || {};
      var logbook = state.logbook || {};
      var point = telemetry.position || telemetry.latest || journey.position || state.position || {};
      var current = logbook.current || state.current || {};

      var vesselState = String(state.state || logbook.status || (journey.active ? 'underway' : 'unknown'));
      var place = first(state, ['location.name', 'current.name', 'logbook.current.name', 'logbook.from.name']);
      var lat = number(first(point, ['lat', 'latitude', 'coordinate.latitude']));
      var lng = number(first(point, ['lng', 'lon', 'longitude', 'coordinate.longitude']));
      var speed = number(first(point, ['speedKnots', 'speed_knots', 'speed']));
      var course = number(first(point, ['course', 'heading']));
      var timestamp = first(point, ['timestamp', 'recordedAt', 'createdAt']);
      var historical = first(telemetry, ['historical', 'isHistorical']);

      document.getElementById('status').textContent = vesselState.replace(/_/g, ' ');
      document.getElementById('place').textContent = place || (journey.active ? 'Underway' : 'Last recorded position');
      document.getElementById('coords').textContent = lat !== null && lng !== null ? lat.toFixed(5) + '° N\n' + lng.toFixed(5) + '° E' : 'No GPS position available';
      document.getElementById('speed').textContent = speed !== null ? speed.toFixed(1) + ' kt' : '—';
      document.getElementById('course').textContent = course !== null ? Math.round(course) + '°' : '—';
      document.getElementById('freshness').textContent = historical === true ? 'Last recorded GPS fix' : (journey.active ? 'Live GPS' : 'Recorded location');
      document.getElementById('updated').textContent = timestamp ? new Date(timestamp).toLocaleString() : new Date().toLocaleString();
      document.getElementById('display').style.display = 'block';
      document.getElementById('error').style.display = 'none';
    }

    function refresh() {
      fetch('/api/vessel-state', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(render)
        .catch(function () {
          document.getElementById('display').style.display = 'none';
          document.getElementById('error').style.display = 'block';
        });
    }

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
